<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊回响 · 暗黑克苏鲁 Roguelike 卡牌 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #101810 0%, #0a0f0b 45%, #060807 100%);
    color:#b8c4ae;
    font-family: Georgia, "Noto Serif SC", "STSong", "SimSun", serif;
    overflow:hidden;
  }
  .hidden { display:none !important; }

  /* ---------- 背景装饰：触手 ---------- */
  #bg-deco { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55; }
  .tentacle { transform-origin: 50% 100%; animation: sway 9s ease-in-out infinite; }
  .tentacle.t2 { animation-duration: 13s; animation-delay:-4s; }
  @keyframes sway { 0%,100%{ transform:rotate(-2.5deg);} 50%{ transform:rotate(2.5deg);} }

  /* ---------- 眼睛 ---------- */
  .eye-svg .eyeball { animation: eyebreathe 4s ease-in-out infinite; transform-origin:center; }
  @keyframes eyebreathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  .eye-svg .iris { animation: irisshift 6s ease-in-out infinite; }
  @keyframes irisshift { 0%,100%{ transform:translateX(-2px);} 50%{ transform:translateX(2px);} }

  .rune-line { color:#4a5a48; letter-spacing:10px; font-size:13px; text-align:center; opacity:.8; }

  /* ---------- 标题界面 ---------- */
  #screen-title { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; }
  .game-title { font-size:52px; letter-spacing:16px; color:#c9d6bd; text-shadow:0 0 24px #4a7a4a66, 0 0 60px #6a4a8a44; }
  .game-sub { font-size:14px; letter-spacing:6px; color:#6a7a64; }
  .title-rules { max-width:760px; text-align:center; font-size:12.5px; color:#7a8a72; line-height:1.9; border:1px solid #223022; padding:10px 22px; background:#0c110c99; }
  #char-row { display:flex; gap:26px; margin-top:8px; }
  .char-card {
    width:240px; padding:18px 16px; cursor:pointer;
    background:linear-gradient(160deg,#131a13 0%, #0d100f 70%);
    border:1px solid #2a3a2a; position:relative;
    transition: all .25s ease;
  }
  .char-card:hover { border-color:#6a4a8a; box-shadow:0 0 24px #6a4a8a44, inset 0 0 30px #6a4a8a11; transform:translateY(-4px); }
  .char-card h3 { font-size:20px; color:#c9d6bd; letter-spacing:3px; text-align:center; }
  .char-card .c-title { text-align:center; font-size:12px; color:#9b7ec8; letter-spacing:2px; margin:2px 0 10px; }
  .char-card .c-bg { font-size:12px; color:#8a9a82; line-height:1.8; min-height:78px; border-top:1px dashed #2a3a2a; border-bottom:1px dashed #2a3a2a; padding:8px 2px; margin-bottom:8px; }
  .char-card .c-mech { font-size:12px; color:#6fae6f; line-height:1.7; margin-bottom:6px; }
  .char-card .c-style { font-size:12px; color:#7a8a72; line-height:1.7; margin-bottom:10px; }
  .char-card .c-stats { display:flex; justify-content:space-between; font-size:12.5px; }
  .char-card .hp-v { color:#a8564a; } .char-card .san-v { color:#9b7ec8; }

  /* ---------- 游戏主界面 ---------- */
  #screen-game { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; }
  #hud { display:flex; align-items:center; gap:14px; padding:8px 16px; background:linear-gradient(#0d130e, #0a0e0a); border-bottom:1px solid #223022; flex-wrap:wrap; }
  .hud-char { font-size:15px; color:#c9d6bd; letter-spacing:2px; min-width:180px; display:flex; align-items:center; }
  .bar-wrap { width:190px; }
  .bar-label { font-size:11px; color:#8a9a82; display:flex; justify-content:space-between; margin-bottom:2px; }
  .bar { height:12px; background:#0a0d0a; border:1px solid #2a3a2a; position:relative; overflow:hidden; }
  .bar .fill { height:100%; transition:width .3s ease; }
  .fill.hp-f { background:linear-gradient(90deg,#5a2620,#a8564a); }
  .fill.san-f { background:linear-gradient(90deg,#3a2650,#9b7ec8); }
  .chip { font-size:12px; padding:3px 9px; border:1px solid #2a3a2a; background:#0c110c; color:#b8c4ae; }
  .chip.block-chip { color:#7ab0d9; border-color:#2a4a5a; }
  .energy-box { display:flex; gap:5px; align-items:center; }
  .energy-pip { width:16px; height:16px; transform:rotate(45deg); border:1px solid #4a5a48; background:#0a0d0a; }
  .energy-pip.on { background:#9b7ec8; border-color:#b89ae0; box-shadow:0 0 8px #9b7ec888; }
  .energy-num { color:#b89ae0; font-size:14px; margin-left:4px; }
  #node-track { display:flex; gap:10px; align-items:center; margin-left:auto; }
  .node-dot { display:flex; flex-direction:column; align-items:center; font-size:10.5px; color:#5a6a55; }
  .node-dot .d { width:12px; height:12px; border-radius:50%; border:1px solid #3a4a3a; background:#0a0d0a; margin-bottom:3px; }
  .node-dot.done .d { background:#3a5a3a; }
  .node-dot.cur .d { background:#9b7ec8; box-shadow:0 0 10px #9b7ec8; }
  .node-dot.cur { color:#b89ae0; }
  #turn-info { font-size:12px; color:#8a9a82; }

  #main-area { flex:1; display:flex; min-height:0; }
  #battlefield { flex:1; display:flex; flex-direction:column; min-width:0; }
  #enemy-zone { flex:1; display:flex; align-items:center; justify-content:center; gap:34px; padding:12px; position:relative; }
  #intent-banner { position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:12px; color:#8a6ab0; letter-spacing:2px; }

  .enemy-card {
    width:210px; padding:12px; text-align:center; cursor:default;
    background:linear-gradient(165deg,#141018 0%, #0c0a10 75%);
    border:1px solid #3a2a4a; position:relative;
  }
  .enemy-card.dead { opacity:.15; filter:grayscale(1); }
  .enemy-card.targetable { cursor:pointer; border-color:#a8564a; box-shadow:0 0 18px #a8564a66; animation:targetPulse 1s ease-in-out infinite; }
  @keyframes targetPulse { 0%,100%{ box-shadow:0 0 10px #a8564a44;} 50%{ box-shadow:0 0 22px #a8564a99;} }
  .enemy-card .e-name { font-size:16px; color:#d0c4dc; letter-spacing:2px; }
  .enemy-card .e-tier { font-size:10.5px; padding:1px 6px; border:1px solid #4a3a5a; color:#9b7ec8; margin-left:6px; vertical-align:2px; }
  .enemy-card .e-mech { font-size:11px; color:#6a7a64; margin-top:5px; line-height:1.6; min-height:32px; }
  .enemy-card .e-hpbar { margin-top:7px; }
  .enemy-card .e-block { font-size:11.5px; color:#7ab0d9; margin-top:4px; min-height:15px; }
  .enemy-card .e-intent { margin-top:8px; border-top:1px dashed #3a2a4a; padding-top:7px; font-size:13px; min-height:44px; }
  .intent-tag { display:inline-block; padding:2px 8px; border:1px solid; margin:1px 2px; font-size:12.5px; letter-spacing:1px; }
  .it-atk { color:#d98880; border-color:#7a3a30; }
  .it-san { color:#b89ae0; border-color:#5a3a7a; }
  .it-blk { color:#8ab8d9; border-color:#3a5a7a; }
  .it-buff { color:#d9b070; border-color:#7a5a2a; }
  .it-heal { color:#8ad9a8; border-color:#3a7a5a; }
  .it-curse { color:#c88ad9; border-color:#6a3a7a; }
  .it-desc { font-size:10.5px; color:#6a7a64; margin-top:4px; }

  #log-panel { width:250px; border-left:1px solid #223022; background:#0a0e0acc; padding:8px 10px; display:flex; flex-direction:column; }
  #log-panel h4 { font-size:12px; color:#6a7a64; letter-spacing:3px; margin-bottom:6px; }
  #log-list { flex:1; overflow-y:auto; font-size:11.5px; line-height:1.75; color:#8a9a82; }
  #log-list .l-hl { color:#c9d6bd; } #log-list .l-bad { color:#d98880; } #log-list .l-mad { color:#b89ae0; } #log-list .l-good { color:#8ad9a8; }

  #bottom-bar { display:flex; align-items:center; justify-content:center; padding:10px 16px 14px; position:relative; border-top:1px solid #1a241a; background:#090c09; }
  #end-turn-btn {
    position:absolute; right:26px; top:50%; transform:translateY(-50%);
    padding:10px 22px; font-size:15px; letter-spacing:4px; cursor:pointer;
    color:#c9d6bd; background:linear-gradient(#1a2a1a,#101a10); border:1px solid #3a5a3a;
    font-family:inherit;
  }
  #end-turn-btn:hover { border-color:#6fae6f; box-shadow:0 0 14px #4a7a4a66; }
  #hand-area { display:flex; gap:10px; }
  .card {
    width:148px; height:196px; padding:9px 9px 7px; cursor:pointer; position:relative;
    background:linear-gradient(170deg,#161d16 0%, #0e120d 80%);
    border:1px solid #3a4a3a; display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform:translateY(-12px); box-shadow:0 6px 20px #00000088; }
  .card.disabled { opacity:.45; cursor:not-allowed; }
  .card.disabled:hover { transform:none; }
  .card.t-攻击 { border-color:#6a3a30; } .card.t-攻击 .card-cost { border-color:#a8564a; color:#d98880; }
  .card.t-防御 { border-color:#3a5a6a; } .card.t-防御 .card-cost { border-color:#7ab0d9; color:#8ab8d9; }
  .card.t-技能 { border-color:#3a6a5a; } .card.t-技能 .card-cost { border-color:#6fae6f; color:#8ad9a8; }
  .card.t-疯狂 { border-color:#5a3a6a; background:linear-gradient(170deg,#1a1420 0%, #100c14 80%); } .card.t-疯狂 .card-cost { border-color:#b89ae0; color:#b89ae0; }
  .card-head { display:flex; align-items:center; gap:7px; }
  .card-cost { width:24px; height:24px; border-radius:50%; border:1.5px solid; display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; background:#0a0d0a; }
  .card-name { font-size:13.5px; color:#d0d8c8; letter-spacing:1px; line-height:1.25; }
  .card-meta { font-size:10px; margin-top:4px; color:#6a7a64; letter-spacing:1px; }
  .r-起始 { color:#7a8a72; } .r-普通 { color:#9aa89a; } .r-稀有 { color:#6faed9; } .r-史诗 { color:#c89a4a; } .r-诅咒 { color:#c88ad9; }
  .card-desc { font-size:11.5px; line-height:1.65; color:#a8b4a0; margin-top:8px; flex:1; }
  .card-foot { text-align:center; font-size:10px; color:#4a5a48; letter-spacing:6px; }
  #deck-counts { position:absolute; left:20px; bottom:12px; font-size:11.5px; color:#6a7a64; }
  #cancel-target { position:absolute; left:50%; transform:translateX(-50%); top:-34px; font-size:12.5px; color:#d98880; letter-spacing:2px; }
  #cancel-target button { margin-left:10px; background:none; border:1px solid #7a3a30; color:#d98880; cursor:pointer; font-family:inherit; font-size:12px; padding:2px 10px; }

  /* ---------- 弹窗 ---------- */
  #modal-layer { position:fixed; inset:0; z-index:10; background:#04060466; backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; }
  .modal {
    max-width:680px; width:92%; max-height:88vh; overflow-y:auto;
    background:linear-gradient(165deg,#12180f 0%, #0c0e12 100%);
    border:1px solid #3a4a3a; box-shadow:0 0 50px #000000cc, inset 0 0 60px #6a4a8a0d;
    padding:26px 30px; text-align:center;
  }
  .modal h2 { font-size:24px; letter-spacing:6px; color:#c9d6bd; margin-bottom:6px; }
  .modal .m-sub { font-size:12px; color:#6a7a64; letter-spacing:3px; margin-bottom:14px; }
  .modal .m-desc { font-size:13.5px; color:#a8b4a0; line-height:2; text-align:left; margin:0 auto 18px; max-width:560px; }
  .modal .m-result { font-size:13.5px; color:#8ad9a8; line-height:2; margin-bottom:16px; }
  .opt-btn {
    display:block; width:100%; text-align:left; margin:8px 0; padding:11px 14px; cursor:pointer;
    background:#0e130e; border:1px solid #2a3a2a; color:#b8c4ae; font-family:inherit; font-size:13.5px; line-height:1.7;
  }
  .opt-btn:hover { border-color:#6a4a8a; box-shadow:0 0 12px #6a4a8a33; }
  .opt-btn .o-label { color:#c9d6bd; letter-spacing:2px; }
  .opt-btn .o-desc { font-size:12px; color:#7a8a72; }
  .reward-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  .reward-row .card { cursor:pointer; }
  .reward-row .card:hover { border-color:#c89a4a; box-shadow:0 0 18px #c89a4a44; }
  .skip-btn, .restart-btn {
    margin-top:8px; padding:9px 26px; background:none; border:1px solid #3a4a3a; color:#8a9a82;
    cursor:pointer; font-family:inherit; font-size:13.5px; letter-spacing:3px;
  }
  .skip-btn:hover, .restart-btn:hover { border-color:#6a7a64; color:#c9d6bd; }
  .big-verdict { font-size:34px; letter-spacing:10px; margin:10px 0 4px; }
  .verdict-lose { color:#a8564a; text-shadow:0 0 24px #a8564a66; }
  .verdict-win { color:#8ad9a8; text-shadow:0 0 24px #4a7a4a66; }

  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:#2a3a2a; } ::-webkit-scrollbar-track { background:#0a0d0a; }
</style>
</head>

<script>
'use strict';
/* =====================================================================
   深渊回响 —— 暗黑克苏鲁 Roguelike 卡牌构建 Demo（第一层可玩）
   规则：3能量/回合，抽5张牌，HP与理智任一归零即败，牌组只增不减，
        节点顺序固定：事件→战斗→事件→战斗→守关战
===================================================================== */

/* ---------------- 卡牌数据库 ---------------- */
const CARD_DB = {
  /* 调查员起始 */

  instinct:    {name:'猎手直觉',     cost:1, type:'攻击', rarity:'起始', description:'造成4点伤害，抽1张牌。', effects:{damage:4, draw:1}},
  allout:      {name:'全力搏杀',     cost:3, type:'攻击', rarity:'起始', description:'造成18点伤害。', effects:{damage:18}},
  guard_basic: {name:'稳健防御',     cost:1, type:'防御', rarity:'起始', description:'获得6点护盾。', effects:{block:6}},
  roll:        {name:'战术翻滚',     cost:1, type:'防御', rarity:'起始', description:'获得5点护盾，抽1张牌。', effects:{block:5, draw:1}},

  ironwill:    {name:'钢铁意志',     cost:1, type:'技能', rarity:'起始', description:'恢复6点理智。', effects:{sanityGain:6}},
  /* 疯狂诗人起始 */
  bloodscript:   {name:'血色手稿',   cost:1, type:'攻击', rarity:'起始', description:'失去2点生命，造成9点伤害。', effects:{selfHp:2, damage:9}},
  sacrificial:   {name:'献祭之刃',   cost:2, type:'攻击', rarity:'起始', description:'失去4点理智，造成16点伤害。', effects:{selfSanity:4, damage:16}},

  echo:          {name:'疯狂回响',   cost:1, type:'疯狂', rarity:'起始', description:'失去3点理智，造成8点伤害，抽1张牌。', effects:{selfSanity:3, damage:8, draw:1}},
  forbiddenhymn: {name:'禁忌颂歌',   cost:3, type:'疯狂', rarity:'起始', description:'失去5点理智，对所有敌人造成14点伤害。', effects:{selfSanity:5, damageAll:14}},
  murmur:        {name:'呢喃低语',   cost:0, type:'疯狂', rarity:'起始', description:'失去2点理智，抽2张牌。', effects:{selfSanity:2, draw:2}},
  tremor:        {name:'颤栗韵脚',   cost:1, type:'防御', rarity:'起始', description:'获得7点护盾。', effects:{block:7}},

  surge:         {name:'灵感狂潮',   cost:2, type:'技能', rarity:'起始', description:'抽3张牌，获得1点能量。', effects:{draw:3, energy:1}},
  abyssgaze:     {name:'深渊凝视',   cost:2, type:'技能', rarity:'起始', description:'恢复8点理智，抽1张牌。', effects:{sanityGain:8, draw:1}},
  /* 掘墓人起始 */
  vanguard:    {name:'沉重先驱',     cost:1, type:'攻击', rarity:'起始', description:'造成5点伤害，获得3点护盾。', effects:{damage:5, block:3}},

  finalblow:   {name:'一锹封喉',     cost:3, type:'攻击', rarity:'起始', description:'造成20点伤害。', effects:{damage:20}},
  barrow:      {name:'坟土壁垒',     cost:1, type:'防御', rarity:'起始', description:'获得9点护盾。', effects:{block:9}},
  dig:         {name:'掘墓',         cost:1, type:'防御', rarity:'起始', description:'获得6点护盾，抽1张牌。', effects:{block:6, draw:1}},

function computeIntent(en){
  const mk = id => Object.assign({id}, INTENTS[id]);
  switch(en.key){
    case 'ghoul': {
      let id = ['bite','pounce','shriek'][en.moveCount % 3];
      if(id === 'bite' && en.hp <= 12) id = 'pounce';
      return mk(id);
    }
    case 'crawler': return mk(['wrap','spit','coil'][en.moveCount % 3]);
    case 'cultist': return mk(['chant','dagger','blood','dagger'][en.moveCount % 4]);
    case 'deepone': return mk(['dclaw','tail','cold'][en.moveCount % 3]);
    case 'wraith':  return mk(['wclaw','swhisper','devour'][en.moveCount % 3]);
    case 'priest': {
      const it = mk(['fire','bless','hcurse','fire'][en.moveCount % 4]);
      if(it.id === 'fire' && en.hp < en.maxHp * 0.5) it.dmg = 14;
      return it;
    }
    case 'boss': {
      if((en.moveCount + 1) % 3 === 0) return mk('mad');
      return mk(['whip','gaze','glare','wave'][en.moveCount % 4]);
    }
  }
}

/* ---------------- 节点推进 ---------------- */
function nextNode(){
  if(P().dead) return;
  S.nodeIndex++;
  if(S.nodeIndex > 5){ showVictory(); return; }
  const t = NODES[S.nodeIndex-1];
  if(t === 'event') startEvent();
  else startBattle(t === 'guard');
}

/* ---------------- 事件 ---------------- */
function startEvent(){
  S.phase = 'event';
  const candidates = EVENTS.filter(function(e){ return S.usedEvents.indexOf(e.key) < 0; });
  const ev = randFrom(candidates);
  S.usedEvents.push(ev.key);
  S.pendingEvent = {ev:ev, optIdx:-1, resultText:''};
  const opts = ev.options.map(function(o,i){
    return '<button class="opt-btn" onclick="pickEventOption('+i+')"><span class="o-label">'+o.label+'</span><br><span class="o-desc">'+o.desc+'</span></button>';
  }).join('');
  $id('modal-layer').classList.remove('hidden');
  $id('modal-layer').innerHTML =
    '<div class="modal"><h2>'+ev.title+'</h2><div class="m-sub">— 事 件 —</div>'+
    '<div class="rune-line" style="margin-bottom:10px">ᛝ ᛉ ᛝ ᛉ ᛝ ᛉ ᛝ</div>'+
    '<div class="m-desc">'+ev.desc+'</div>'+opts+'</div>';
  renderHUD();
}
function pickEventOption(i){
  const st = S.pendingEvent, ev = st.ev, o = ev.options[i];
  st.optIdx = i;
  let extra = '';
  if(o.hp){
    if(o.hp < 0){ P().hp = Math.max(0, P().hp + o.hp); log('失去 '+(-o.hp)+' 点生命','l-bad'); }
    else { P().hp = Math.min(P().maxHp, P().hp + o.hp); log('恢复 '+o.hp+' 点生命','l-good'); }
  }
  if(o.san){
    if(o.san < 0){ loseSanity(-o.san, 'event'); }
    else { P().san = Math.min(P().maxSan, P().san + o.san); log('恢复 '+o.san+' 点理智','l-good'); }
  }
  if(o.gamble){
    if(Math.random() < 0.5){ P().san = Math.min(P().maxSan, P().san + 15); log('恢复 15 点理智','l-good'); st.resultText = o.resultGood; }
    else { loseSanity(10, 'event'); st.resultText = o.resultBad; }
  } else {
    st.resultText = o.result;
  }
  if(P().dead){ showGameOver(); return; }
  if(o.reward === 'rare3'){
    S.rewardCtx = {type:'event'};
    openReward(rollRewards(3, false, true), '事件馈赠 · 从3张稀有牌中选择1张加入牌组');
    return;
  }
  if(o.reward === 'randomNormal'){
    const k = randFrom(POOL.normal);
    P().deck.push(newCard(k));
    extra = '<br>你获得了「'+CARD_DB[k].name+'」。';
    log('获得卡牌：'+CARD_DB[k].name,'l-good');
  }
  if(o.reward === 'curse'){
    P().deck.push(newCard('whisper_curse'));
    extra = '<br>「蚀心低语」混入了你的牌组。';
    log('「蚀心低语」混入了牌组','l-mad');
  }
  showEventResult(st.resultText + extra);
}
function showEventResult(text){
  renderHUD();
  $id('modal-layer').classList.remove('hidden');
  $id('modal-layer').innerHTML =
    '<div class="modal"><h2>'+S.pendingEvent.ev.title+'</h2><div class="m-sub">— 结 局 —</div>'+
    '<div class="m-result">'+text+'</div>'+
    '<button class="restart-btn" onclick="continueEvent()">继续前行</button></div>';
}
function continueEvent(){
  $id('modal-layer').classList.add('hidden');
  nextNode();
}

/* ---------------- 奖励 ---------------- */
function rollCardByRarity(){
  const r = Math.random();
  if(r < 0.6) return randFrom(POOL.normal);
  if(r < 0.9) return randFrom(POOL.rare);
  return randFrom(POOL.epic);
}
function rollRewards(count, guaranteeRare, rareOnly){
  const keys = [];
  let guard = false, safety = 0;
  while(keys.length < count && safety++ < 200){
    let k;
    if(rareOnly){ k = randFrom(POOL.rare); }
    else if(guaranteeRare && !guard){ k = randFrom(POOL.rare.concat(POOL.epic)); guard = true; }
    else { k = rollCardByRarity(); }
    if(keys.indexOf(k) < 0) keys.push(k);
  }
  return keys;
}
function openReward(cardKeys, title){
  S.phase = 'reward';
  S.rewardCards = cardKeys;
  const cards = cardKeys.map(function(k,i){ return cardHTML(CARD_DB[k], 'pickReward('+i+')'); }).join('');
  $id('modal-layer').classList.remove('hidden');
  $id('modal-layer').innerHTML =
    '<div class="modal"><h2>战利品</h2><div class="m-sub">'+title+'</div>'+
    '<div class="m-desc">牌组只增不减。选中的牌将加入你的牌组。</div>'+
    '<div class="reward-row">'+cards+'</div>'+
    '<button class="skip-btn" onclick="skipReward()">放弃（什么都不拿）</button></div>';
}
function pickReward(i){
  const k = S.rewardCards[i];
  P().deck.push(newCard(k));
  log('获得卡牌：「'+CARD_DB[k].name+'」','l-good');
  afterReward();
}
function skipReward(){ log('你放弃了奖励。'); afterReward(); }
function afterReward(){
  const fromEvent = (S.rewardCtx && S.rewardCtx.type === 'event');
  $id('modal-layer').classList.add('hidden');
  S.rewardCtx = null;
  if(fromEvent){
    showEventResult(S.pendingEvent.resultText + '<br>你将选中的秘密收进了行囊。');
  } else {
    nextNode();
  }
}

/* ---------------- 战斗 ---------------- */
function mkEnemy(key){
  const d = ENEMY_DB[key];
  return {key:d.key, name:d.name, tier:d.tier, mech:d.mech, hp:d.hp, maxHp:d.hp, block:0, atkBuff:0, moveCount:0, nextIntent:null};
}
function startBattle(isGuard){
  S.phase = 'battle';
  S.pendingCard = null;
  let group;
  if(S.nodeIndex === 2){
    group = [mkEnemy(randFrom(['ghoul','crawler','cultist']))];
  } else if(S.nodeIndex === 4){
    group = shuffle(['ghoul','crawler','cultist','deepone','wraith']).slice(0,2).map(mkEnemy);
  } else {
    group = [mkEnemy('boss')];
  }
  S.battle = {enemies:group, turn:1, isGuard:!!isGuard};
  const p = P();
  p.draw = shuffle(p.deck.slice());
  p.discard = []; p.hand = [];
  p.energy = 3; p.block = 0; p.firstAttack = false; p.sanTrig = 0;
  if(S.charKey === 'gravedigger'){ p.block = 4; log('亡者之躯：获得4点护盾','l-good'); }
  group.forEach(function(en){ en.nextIntent = computeIntent(en); });
  for(const en of group){
    if(en.key === 'wraith'){ en.block = 6; log('缚灵的虚体散发出寒气：获得6点护盾','l-mad'); }
  }
  log(isGuard ? '守关战开始：'+group[0].name+' 睁开了它全部的眼睛。' : '战斗开始：'+group.map(function(e){ return e.name; }).join(' 与 ')+'。','l-hl');
  drawCards(5);
  renderAll();
}
function drawCards(n){
  const p = P();
  for(let i=0;i<n;i++){
    if(p.hand.length >= 10){ log('手牌已满（上限10张），无法再抽。'); break; }
    if(p.draw.length === 0){
      if(p.discard.length === 0){ log('牌库已空，无法再抽。'); break; }
      p.draw = shuffle(p.discard); p.discard = [];
      log('弃牌堆洗回抽牌堆。');
    }
    p.hand.push(p.draw.pop());
  }
}
function cardNeedsTarget(c){
  const alive = S.battle.enemies.filter(function(e){ return e.hp > 0; });
  return !!(c.effects.damage) && alive.length > 1;
}
function onCardClick(idx){
  if(S.phase !== 'battle' || P().dead) return;
  const inst = P().hand[idx];
  if(!inst) return;
  const c = CARD_DB[inst.key];
  if(P().energy < c.cost){ log('能量不足，无法打出「'+c.name+'」。','l-bad'); return; }
  if(cardNeedsTarget(c)){
    if(S.pendingCard && S.pendingCard.uid === inst.uid){ cancelTarget(); return; }
    S.pendingCard = inst;
    renderAll();
    return;
  }
  resolveCard(inst, firstAliveIdx());
}
function firstAliveIdx(){
  return S.battle.enemies.findIndex(function(e){ return e.hp > 0; });
}
function cancelTarget(){ S.pendingCard = null; renderAll(); }
function onEnemyClick(idx){
  if(S.phase !== 'battle' || !S.pendingCard) return;
  const en = S.battle.enemies[idx];
  if(!en || en.hp <= 0) return;
  const inst = S.pendingCard;
  S.pendingCard = null;
  resolveCard(inst, idx);
}
function resolveCard(inst, targetIdx){
  const p = P(), c = CARD_DB[inst.key];
  p.energy -= c.cost;
  p.hand = p.hand.filter(function(x){ return x.uid !== inst.uid; });
  p.discard.push(inst);
  log('你打出了「'+c.name+'」。');
  applyEffects(c, targetIdx);
  if(!p.dead) checkBattleEnd();
  renderAll();
}
function applyEffects(c, targetIdx){
  const p = P(), e = c.effects, inv = (S.charKey === 'investigator');
  if(e.selfHp){
    p.hp = Math.max(0, p.hp - e.selfHp);
    log('失去 '+e.selfHp+' 点生命','l-bad');
    if(checkLoss()) return;
  }
  if(e.selfSanity){
    loseSanity(e.selfSanity, 'card');
    if(p.dead) return;
  }
  function tryBonus(d){
    if(inv && !p.firstAttack){ p.firstAttack = true; log('洞察触发：伤害 +3','l-good'); return d + 3; }
    return d;
  }
  if(e.damage){
    const en = S.battle.enemies[targetIdx];
    dealDamageToEnemy(en, tryBonus(e.damage));
    if(p.dead) return;
  }
  if(e.damageAll){
    const d = tryBonus(e.damageAll);
    S.battle.enemies.forEach(function(en){ if(en.hp > 0) dealDamageToEnemy(en, d); });
    if(p.dead) return;
  }
  if(e.bonusNoBlock){
    const en = S.battle.enemies[targetIdx];
    if(en && en.hp > 0 && en.block <= 0) dealDamageToEnemy(en, e.bonusNoBlock);
  }
  if(e.block){ p.block += e.block; log('获得 '+e.block+' 点护盾','l-good'); }
  if(e.sanityGain){
    p.san = Math.min(p.maxSan, p.san + e.sanityGain);
    log('恢复 '+e.sanityGain+' 点理智','l-good');
  }
  if(e.draw) drawCards(e.draw);
  if(e.energy){ p.energy += e.energy; log('获得 '+e.energy+' 点能量','l-good'); }
}
function dealDamageToEnemy(en, d){
  if(!en || en.hp <= 0) return;
  if(en.block > 0){
    const ab = Math.min(en.block, d);
    en.block -= ab; d -= ab;
    log(en.name+' 的护盾抵挡了 '+ab+' 点伤害。');
  }
  if(d > 0){
    en.hp -= d;
    log('对 '+en.name+' 造成 '+d+' 点伤害。','l-hl');
  }
  if(en.hp <= 0){ en.hp = 0; log(en.name+' 倒下了！','l-good'); }
}
function checkBattleEnd(){
  if(S.phase !== 'battle') return false;
  if(S.battle.enemies.every(function(en){ return en.hp <= 0; })){
    log('战斗胜利！','l-good');
    showBattleReward();
    return true;
  }
  return false;
}
function showBattleReward(){
  const isGuard = S.battle.isGuard;
  S.rewardCtx = {type:'battle'};
  const cards = rollRewards(3, isGuard, false);
  const title = (isGuard ? '守关战胜利 · 层奖励（必含至少1张稀有以上）' : '战斗胜利 · 从3张牌中选择1张加入牌组（或放弃）');
  openReward(cards, title);
}

/* ---------------- 玩家受伤 / 理智 ---------------- */
function hitPlayer(d){
  const p = P();
  if(p.block > 0){
    const ab = Math.min(p.block, d);
    p.block -= ab; d -= ab;
    log('护盾抵挡了 '+ab+' 点伤害。');
  }
  if(d > 0){
    p.hp -= d;
    log('你受到 '+d+' 点伤害。','l-bad');
  }
  checkLoss();
}
function loseSanity(n, src){
  const p = P();
  if(n <= 0 || p.dead) return;
  p.san -= n;
  log('失去 '+n+' 点理智','l-mad');
  if(S.charKey === 'poet' && !p.dead && p.sanTrig < 2){
    p.sanTrig++;
    log('痛苦灵感触发：抽1张牌。','l-good');
    drawCards(1);
  }
  checkLoss();
}
function checkLoss(){
  const p = P();
  if(p.hp <= 0){ p.dead = true; showGameOver('生命归零，你的躯体成了这栋建筑新的地基。'); return true; }
  if(p.san <= 0){ p.dead = true; showGameOver('理智崩解，你笑着走进了墙里，再也没有出来。'); return true; }
  return false;
}

/* ---------------- 敌人回合 ---------------- */
function onEndTurn(){
  if(S.phase !== 'battle' || P().dead) return;
  S.pendingCard = null;
  const p = P();
  p.discard.push.apply(p.discard, p.hand);
  p.hand = [];
  enemyPhase();
  if(p.dead) return;
  S.battle.turn++;
  startPlayerTurn();
  renderAll();
}
function enemyPhase(){
  const p = P();
  S.battle.enemies.forEach(function(en){ if(en.hp > 0) en.block = 0; });
  for(const en of S.battle.enemies){
    if(en.hp <= 0) continue;
    const it = en.nextIntent;
    log(en.name+' 行动：'+it.label+'。');
    if(it.blk){ en.block += it.blk; }
    if(it.buff){ en.atkBuff += it.buff; log(en.name+' 的攻击被强化了！','l-bad'); }
    if(it.curse){ p.discard.push(newCard('whisper_curse')); log('「蚀心低语」混入了你的弃牌堆！','l-mad'); }
    if(it.heal){ en.hp = Math.min(en.maxHp, en.hp + it.heal); }
    if(it.dmg){
      const d = it.dmg + en.atkBuff;
      if(en.atkBuff > 0) log('强化生效！','l-bad');
      en.atkBuff = 0;
      hitPlayer(d);
      if(p.dead) return;
    }
    if(it.san){
      loseSanity(it.san, 'enemy');
      if(p.dead) return;
    }
    if(en.key === 'crawler' && en.hp > 0){
      en.hp = Math.min(en.maxHp, en.hp + 2);
      log(en.name+' 的黏液再生恢复了2点生命。');
    }
    en.moveCount++;
    en.nextIntent = computeIntent(en);
  }
}
function startPlayerTurn(){
  const p = P();
  p.block = 0;
  if(S.charKey === 'gravedigger'){ p.block = 4; log('亡者之躯：获得4点护盾','l-good'); }
  p.energy = 3; p.firstAttack = false; p.sanTrig = 0;
  drawCards(5);
}

/* ---------------- 渲染 ---------------- */
function renderAll(){ renderHUD(); renderEnemies(); renderHand(); renderLog(); }
function renderHUD(){
  const p = P(); if(!p) return;
  const c = CHARACTERS[S.charKey];
  const nodes = NODES.map(function(t,i){
    const cls = (i+1 < S.nodeIndex) ? 'done' : (i+1 === S.nodeIndex ? 'cur' : '');
    return '<div class="node-dot '+cls+'"><div class="d"></div>'+NODE_LABELS[i]+'</div>';
  }).join('<div style="color:#3a4a3a">—</div>');
  $id('hud').innerHTML =
    '<div class="hud-char">'+eyeSvg(42)+' '+c.title+' · '+c.name+'</div>'+
    '<div class="bar-wrap"><div class="bar-label"><span>生命</span><span>'+p.hp+' / '+p.maxHp+'</span></div>'+
      '<div class="bar"><div class="fill hp-f" style="width:'+(p.hp/p.maxHp*100)+'%"></div></div></div>'+
    '<div class="bar-wrap"><div class="bar-label"><span>理智</span><span>'+p.san+' / '+p.maxSan+'</span></div>'+
      '<div class="bar"><div class="fill san-f" style="width:'+(p.san/p.maxSan*100)+'%"></div></div></div>'+
    '<div class="chip block-chip">护盾 '+p.block+'</div>'+
    '<div class="energy-box"><span style="font-size:12px;color:#8a9a82">能量</span>'+
      [0,1,2].map(function(i){ return '<div class="energy-pip'+(i < p.energy ? ' on' : '')+'"></div>'; }).join('')+
      '<span class="energy-num">'+p.energy+'</span></div>'+
    '<div id="node-track">'+nodes+'</div>'+
    '<div id="turn-info">'+(S.battle ? '第 '+S.battle.turn+' 回合' : '第 1 层')+'</div>'+
    '<button class="skip-btn" style="margin:0;padding:4px 12px;font-size:11px" onclick="restart()">重新开始</button>';
  $id('deck-counts').innerHTML = '抽牌堆 '+p.draw.length+' · 弃牌堆 '+p.discard.length+' · 牌组 '+p.deck.length;
  $id('cancel-target').classList.toggle('hidden', !S.pendingCard);
}
function intentHTML(it){
  let tags = '';
  if(it.dmg) tags += '<span class="intent-tag '+it.cls+'">斩 '+it.dmg+'</span>';
  if(it.san) tags += '<span class="intent-tag it-san">蚀 '+it.san+'</span>';
  if(it.blk) tags += '<span class="intent-tag it-blk">盾 '+it.blk+'</span>';
  if(it.heal) tags += '<span class="intent-tag it-heal">愈 '+it.heal+'</span>';
  if(it.buff) tags += '<span class="intent-tag it-buff">力 +'+it.buff+'</span>';
  if(it.curse) tags += '<span class="intent-tag it-curse">咒</span>';
  return tags + '<div class="it-desc">'+it.desc+'</div>';
}
function renderEnemies(){
  const zone = $id('enemy-zone');
  if(!S.battle){ zone.innerHTML = ''; return; }
  const banner = S.pendingCard
    ? '<div id="intent-banner" style="color:#d98880">打出「'+CARD_DB[S.pendingCard.key].name+'」—— 请点击选择目标</div>'
    : '<div id="intent-banner">敌人永远提前1回合公开意图</div>';
  zone.innerHTML = banner + S.battle.enemies.map(function(en,i){
    const cls = 'enemy-card' + (en.hp <= 0 ? ' dead' : '') + (S.pendingCard && en.hp > 0 ? ' targetable' : '');
    return '<div class="'+cls+'" onclick="onEnemyClick('+i+')">'+
      '<div><span class="e-name">'+en.name+'</span><span class="e-tier">'+en.tier+'</span></div>'+
      '<div class="e-mech">'+en.mech+'</div>'+
      '<div class="e-hpbar"><div class="bar-label"><span>生命</span><span>'+en.hp+' / '+en.maxHp+'</span></div>'+
        '<div class="bar"><div class="fill hp-f" style="width:'+(en.hp/en.maxHp*100)+'%"></div></div></div>'+
      '<div class="e-block">'+(en.block > 0 ? '护盾 '+en.block : '')+(en.atkBuff > 0 ? ' · 攻击 +'+en.atkBuff : '')+'</div>'+
      '<div class="e-intent"><div style="font-size:10.5px;color:#6a7a64;margin-bottom:3px">下回合意图</div>'+intentHTML(en.nextIntent)+'</div>'+
    '</div>';
  }).join('');
}
function cardHTML(c, onclick){
  return '<div class="card t-'+c.type+'" '+(onclick ? 'onclick="'+onclick+'"' : '')+'>'+
    '<div class="card-head"><div class="card-cost">'+c.cost+'</div><div class="card-name">'+c.name+'</div></div>'+
    '<div class="card-meta">'+c.type+' · <span class="r-'+c.rarity+'">'+c.rarity+'</span></div>'+
    '<div class="card-desc">'+c.description+'</div>'+
    '<div class="card-foot">ᚠᚢᚦ</div></div>';
}
function renderHand(){
  const area = $id('hand-area');
  if(!S.battle){ area.innerHTML = ''; return; }
  area.innerHTML = P().hand.map(function(inst,i){
    const c = CARD_DB[inst.key];
    const disabled = P().energy < c.cost || S.phase !== 'battle';
    let html = cardHTML(c, 'onCardClick('+i+')');
    if(disabled) html = html.replace('class="card t-', 'class="card disabled t-');
    return html;
  }).join('');
}

/* ---------------- 终局 ---------------- */
function showGameOver(reason){
  S.phase = 'over';
  $id('modal-layer').classList.remove('hidden');
  $id('modal-layer').innerHTML =
    '<div class="modal"><div class="big-verdict verdict-lose">调查终止</div>'+
    '<div class="m-sub">— 你 失 败 了 —</div><div class="m-desc" style="text-align:center">'+reason+'</div>'+
    '<div class="m-result">深渊回响着你的名字。牌组与数值已全部重置。</div>'+
    '<button class="restart-btn" onclick="restart()">重新开始</button></div>';
}
function showVictory(){
  S.phase = 'victory';
  const p = P();
  $id('modal-layer').classList.remove('hidden');
  $id('modal-layer').innerHTML =
    '<div class="modal"><div class="big-verdict verdict-win">第一层已通关</div>'+
    '<div class="m-sub">— 守 关 战 胜 利 —</div>'+
    '<div class="m-result">巨眼的瞳孔收缩成针尖，整层建筑在你身后坍缩成一张发潮的旧地图。<br>'+
    '（完整版中你将带着不恢复的 HP 与理智进入更深的第二层；Demo 到此结束。）</div>'+
    '<div class="m-desc" style="text-align:center">剩余生命 '+p.hp+'/'+p.maxHp+' · 剩余理智 '+p.san+'/'+p.maxSan+' · 牌组 '+p.deck.length+' 张</div>'+
    '<button class="restart-btn" onclick="restart()">再入深渊</button></div>';
}
function restart(){
  S.phase = 'title'; S.charKey = null; S.player = null; S.battle = null;
  S.pendingCard = null; S.pendingEvent = null; S.rewardCtx = null; S.nodeIndex = 0;
  S.usedEvents = []; LOGS.length = 0;
  renderTitle();
}

renderTitle();
</script>
